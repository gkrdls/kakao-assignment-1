<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-app">
    <section class="todo-panel" aria-labelledby="app-title">
      <div class="todo-header">
        <p class="eyebrow">Today</p>
        <h1 id="app-title">Todo</h1>
      </div>

      <div class="date-navigator" aria-label="Todo week selection">
        <button type="button" class="date-button" id="previous-date-button" aria-label="Previous week">저번 주</button>
        <p class="selected-date" id="selected-date" aria-live="polite"></p>
        <button type="button" class="date-button today-date-button" id="today-date-button" aria-label="Today">오늘</button>
        <button type="button" class="date-button" id="next-date-button" aria-label="Next week">다음 주</button>
      </div>

      <div class="week-view" id="week-view" aria-label="This week todos"></div>

      <form class="todo-form" id="todo-form">
        <label class="sr-only" for="todo-input">Todo input</label>
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="Enter a todo"
          autocomplete="off"
        >
        <button type="submit" class="add-button">추가</button>
      </form>

      <p class="message" id="message" role="alert" aria-live="polite"></p>

      <div class="filter-tabs" role="tablist" aria-label="Todo status filter">
        <button type="button" class="filter-tab active" data-filter="all" role="tab" aria-selected="true">전체</button>
        <button type="button" class="filter-tab" data-filter="active" role="tab" aria-selected="false">진행중</button>
        <button type="button" class="filter-tab" data-filter="completed" role="tab" aria-selected="false">완료</button>
      </div>

      <p class="empty-message" id="empty-message"></p>
      <ul class="todo-list" id="todo-list" aria-label="Todo list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
